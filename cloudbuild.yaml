steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - functions
      - deploy
      - send_email_alert
      - --runtime=python310
      - --region=europe-west1
      - --entry-point=send_email_alert
      - --trigger-topic=DataMaintenance_test2  # Usa il nome del TOPIC, non della sub
      - --source=.

options:
  logging: CLOUD_LOGGING_ONLY